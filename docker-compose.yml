services:
  emby-302-proxy:
    image: 01dmt/emby417
    container_name: emby-302-proxy
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${WEB_UI_PORT:-8417}:8417"
      # 按你的 Emby 反代端口自行放行，例如：
      # - "5088:5088"
      # - "5089:5089"
    volumes:
      - ./data:/data

# 使用方法：
# 1. 创建 .env 文件
# 2. docker compose up -d
#
# .env 示例：
# WEB_UI_PORT=8417
# TZ=Asia/Shanghai
#
# 如果需要固定访问域名再按需配置：
# CANONICAL_HOST=your.domain.or.ip

name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version Tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version_tag="${GITHUB_REF_NAME}"
          else
            git fetch --tags --force
            latest_tag=$(git tag --list 'v*' --sort=-version:refname | head -n 1)

            if [[ -z "$latest_tag" ]]; then
              version_tag="v1.0"
            else
              version="${latest_tag#v}"
              major="${version%%.*}"
              minor="${version##*.}"
              if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ ]]; then
                echo "Unsupported tag format: $latest_tag"
                exit 1
              fi
              next_minor=$((minor + 1))
              version_tag="v${major}.${next_minor}"
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if git rev-parse "$version_tag" >/dev/null 2>&1; then
              echo "Tag already exists: $version_tag"
            else
              git tag "$version_tag"
              git push origin "$version_tag"
            fi
          fi

          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: 01dmt/emby417
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version_tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=emby417
            org.opencontainers.image.description=Emby 302 proxy with p115client integration and admin UI
            org.opencontainers.image.version=${{ steps.version.outputs.version_tag }}
            org.opencontainers.image.source=https://github.com/01dmt/emby417

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}